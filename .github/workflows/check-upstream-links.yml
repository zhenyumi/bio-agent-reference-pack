name: check-upstream-links

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements-dev.txt
      - name: Check upstream links
        run: python3 scripts/check_links_online.py --no-fail --report
      - name: Upload link check report
        uses: actions/upload-artifact@v4
        with:
          name: links-check-report
          path: reports/links-check.yaml
